[package]
name = "email-manager-backend"
version = "0.1.0"
edition = "2021"
description = "Reusable Eco transactional email domain (Brevo)"

[dependencies]
axum = { version = "0.7", features = ["json", "http1", "tokio"] }
tokio = { version = "1.38", features = ["full"] }
mongodb = { version = "2.8", features = ["bson-chrono-0_4"] }
bson = { version = "2.9", features = ["chrono-0_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.5", features = ["cors"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
